<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minha Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="menu" aria-label="Menu principal">
      <a class="marca" href="#/inicio">
        <span class="marca-simbolo" aria-hidden="true">M</span>
        <span class="marca-nome">Minha<br />Administração</span>
      </a>
      <nav>
        <a href="#/inicio" data-rota="inicio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>
          <span>Início</span>
        </a>
        <a href="#/financas" data-rota="financas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 14.5h2"/></svg>
          <span>Finanças</span>
        </a>
        <a href="#/contas" data-rota="contas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
          <span>Contas</span>
        </a>
        <a href="#/tarefas" data-rota="tarefas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>
          <span>Tarefas</span>
        </a>
      </nav>
    </aside>

    <main id="tela" tabindex="-1"></main>
  </div>

  <dialog id="modal" aria-labelledby="modal-titulo">
    <form method="dialog" id="modal-form" novalidate>
      <h2 id="modal-titulo"></h2>
      <div id="modal-corpo"></div>
      <p id="modal-erro" class="erro-form" role="alert" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn btn-leve" value="cancelar" id="modal-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-principal" id="modal-ok">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
