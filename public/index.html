<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minha Administração</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <aside class="menu" aria-label="Menu principal">
      <a class="marca" href="#/">
        <span class="marca-simbolo" aria-hidden="true">M</span>
        <span class="marca-nome">Minha<br />Administração</span>
      </a>
      <nav id="menu-nav"></nav>
      <div id="menu-usuario" class="menu-usuario"></div>
    </aside>
    <button type="button" class="menu-fundo" data-acao="abrir-menu" aria-label="Fechar menu" tabindex="-1"></button>

    <div class="topo-movel">
      <button type="button" class="icone-btn" data-acao="abrir-menu" aria-label="Abrir menu">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="marca-simbolo" aria-hidden="true">M</span>
      <strong>Minha Administração</strong>
    </div>

    <main id="tela" tabindex="-1"><p class="carregando">Carregando…</p></main>
  </div>

  <dialog id="modal" aria-labelledby="modal-titulo">
    <form method="dialog" id="modal-form" novalidate>
      <h2 id="modal-titulo"></h2>
      <div id="modal-corpo"></div>
      <p id="modal-erro" class="erro-form" role="alert" hidden></p>
      <div class="modal-acoes">
        <button type="button" class="btn btn-leve" id="modal-cancelar">Cancelar</button>
        <button type="submit" class="btn btn-principal" id="modal-ok">Salvar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/base.js"></script>
  <script src="js/cadastros.js"></script>
  <script src="js/pf.js"></script>
  <script src="js/pj.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
