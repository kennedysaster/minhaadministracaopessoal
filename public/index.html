<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Minha Administração Pessoal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topo">
    <div>
      <h1>Minha Administração Pessoal</h1>
      <p class="sub">Finanças, tarefas e contas em um só lugar</p>
    </div>
    <label class="mes">Mês <input type="month" id="mes" /></label>
  </header>

  <main>
    <!-- Resumo -->
    <section class="cards" id="resumo">
      <div class="card"><span class="rotulo">Receitas</span><strong id="r-receitas" class="pos">–</strong></div>
      <div class="card"><span class="rotulo">Despesas</span><strong id="r-despesas" class="neg">–</strong></div>
      <div class="card"><span class="rotulo">Saldo do mês</span><strong id="r-saldo">–</strong></div>
      <div class="card"><span class="rotulo">Contas em aberto</span><strong id="r-contas">–</strong><small id="r-contas-info"></small></div>
      <div class="card"><span class="rotulo">Tarefas pendentes</span><strong id="r-tarefas">–</strong><small id="r-tarefas-info"></small></div>
    </section>

    <div class="grade">
      <!-- Finanças -->
      <section class="painel" id="financas">
        <h2>Finanças</h2>
        <form id="f-transacao" class="form">
          <input name="descricao" placeholder="Descrição" required />
          <input name="valor" type="number" step="0.01" min="0" placeholder="Valor" required />
          <select name="tipo">
            <option value="despesa">Despesa</option>
            <option value="receita">Receita</option>
          </select>
          <input name="categoria" placeholder="Categoria" list="categorias" />
          <datalist id="categorias">
            <option>Alimentação</option><option>Moradia</option><option>Transporte</option>
            <option>Saúde</option><option>Lazer</option><option>Educação</option>
            <option>Salário</option><option>Contas</option><option>Outros</option>
          </datalist>
          <input name="data" type="date" />
          <button>Adicionar</button>
        </form>
        <div id="categorias-barras" class="barras"></div>
        <ul id="l-transacoes" class="lista"></ul>
      </section>

      <!-- Tarefas -->
      <section class="painel" id="tarefas">
        <h2>Tarefas</h2>
        <form id="f-tarefa" class="form">
          <input name="titulo" placeholder="Nova tarefa" required />
          <input name="prazo" type="date" />
          <select name="prioridade">
            <option value="media">Média</option>
            <option value="alta">Alta</option>
            <option value="baixa">Baixa</option>
          </select>
          <button>Adicionar</button>
        </form>
        <ul id="l-tarefas" class="lista"></ul>
      </section>

      <!-- Contas -->
      <section class="painel" id="contas">
        <h2>Contas a pagar</h2>
        <form id="f-conta" class="form">
          <input name="descricao" placeholder="Conta (ex.: Luz)" required />
          <input name="valor" type="number" step="0.01" min="0" placeholder="Valor" required />
          <input name="vencimento" type="date" required />
          <button>Adicionar</button>
        </form>
        <p class="dica">Ao marcar como paga, a despesa é lançada automaticamente em Finanças.</p>
        <ul id="l-contas" class="lista"></ul>
      </section>
    </div>
  </main>

  <div id="aviso" class="aviso" hidden></div>
  <script src="app.js"></script>
</body>
</html>
